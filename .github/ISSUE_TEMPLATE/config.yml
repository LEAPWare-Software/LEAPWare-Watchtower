  #          present, readme present, ISSUE_TEMPLATE NULL
  #
  # That one null is what holds the number below 100, and it is wrong about this
  # repository: five YAML issue forms sit in this directory and the check does
  # not credit them. It is a property of GitHub's checklist rather than of this
  # product - a reader opening "New issue" meets five forms with required fields
  # and a chooser that routes vulnerabilities away from public issues, which is
  # strictly more than a legacy single-file template gives them.
  # NOTHING WAS ADDED TO MOVE THE NUMBER. A legacy ISSUE_TEMPLATE.md added for
