      - name: Doctor behaviour suite
        shell: powershell
        run: |
          # The step that drives the component whose whole job is to notice a
          # switch wired to nothing. Until it landed, nothing in tests\ had ever
          # RUN bin\lwg-doctor.ps1 against a seeded config or a seeded
          # settings.json - tests\doc_claims.ps1 runs it once, on the real tree,
          # and reads only the "- N checks" line out of its header. Two checks
          # inside it had therefore never been driven at all, and both answered
          # a question cheaper than the one they claim to answer:
          #
          #   config-registry  it tested a declared switch for PRESENCE and
          #                    stopped, so `"delegate": "true"` - quoted - passed
          #                    while Test-LwgFlag, which requires a real [bool],
          #                    ignored the string and left the only gate this
          #                    plugin ships on its built-in default of $false.
          #   statusline       it took the first token ending in .ps1 out of
          #                    statusLine.command and hash-compared it against
          #                    this repo's copy with no test of WHOSE file it is,
          #                    so a third party's status line was diagnosed as a
          #                    stale copy of this plugin's - with the printed
          #                    remedy being to overwrite it.
          #
          # IT DRIVES TWO OF THE NINE CHECKS AND NO OTHERS, and a green run here
          # says nothing about the other seven. In particular it says nothing
          # about sessionstart, which is owned by a separate issue and is
          # deliberately untouched. Read the suite header rather than this
          # comment if the two ever disagree.
          #
          # The whole plugin tree is COPIED once into a scratch directory, minus
          # .git and .claude, and every case runs the copy's own
          # bin\lwg-doctor.ps1 in a real child process - the doctor derives its
          # root from its own $PSScriptRoot, so the copy is what it reads and no
          # test seam was added to the shipped script for this. USERPROFILE and
          # CLAUDE_PLUGIN_DATA are redirected per case and CLAUDE_PLUGIN_ROOT is
          # cleared, so nothing is written back to the checkout. The last case
          # measures the operator's real state directory before the first child
          # and after the last and fails if any file grew or appeared.
          #
          # SEVEN OF ITS SIXTEEN CASES PASS AT THE PRE-FIX BASELINE TOO and every
          # one of them is labelled CONTROL. None is offered as evidence that
          # anything was fixed; they exist because the cheapest way to pass the
          # other nine is to answer "not ours" to everything and "FAIL" to every
          # config, and the controls are what make that not work.
          #
          # WHAT IT DOES NOT COVER, from the suite header rather than inferred: a
          # foreign status line that is BYTE-IDENTICAL to the repo copy cannot be
          # detected and no case pretends to; the provenance marker is FORGEABLE,
          # so any file carrying the token is claimed as this plugin's, which is
          # a stated LIMIT and not a defect awaiting a fix; whether the status
          # line RENDERS is not asked here at all.
          #
          # Same capture pattern as the steps around it: a nonzero native exit
          # code does NOT fail a PowerShell step on its own, so it is re-raised
          # explicitly, and stderr is deliberately not merged with 2>&1 - in
          # Windows PowerShell 5.1 that wraps native stderr in NativeCommandError
          # records and corrupts the result.
          $ErrorActionPreference = 'Continue'
          $suite = 'tests\doctor_behaviour.ps1'

          if (-not (Test-Path -LiteralPath $suite -PathType Leaf)) {
            Write-Host "::error::$suite is missing - the doctor's checks were never exercised, which is not the same as passing"
            exit 1
          }

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $suite
          $code = if ($null -eq $LASTEXITCODE) { 255 } else { $LASTEXITCODE }

          # Exit-code contract of tests\doctor_behaviour.ps1, the same three this
          # repo's other suites use. An abort is never reported as a pass.
          #   0  every case passed
          #   1  at least one case failed
          #   2  the suite aborted; the doctor was NOT exercised. Zero cases run
          #      is an abort, never an empty-set pass.
          $label = switch ($code) {
            0       { 'PASS - config-registry still refuses a quoted flag the reader ignores, and statusline still asks whose file it is before calling one a stale copy. That is TWO of the nine checks: the other seven are not driven here, and a byte-identical or token-bearing foreign status line is a stated limit rather than something this suite catches.' }
            1       { 'FAIL (exit 1) - a doctor check did not behave as declared. Read the per-case lines above. A config-registry case that passed a non-boolean means an operator can disarm the only gate this plugin ships with a typo and be told it is armed; a statusline case that claimed a foreign file means the printed remedy is to overwrite somebody else''s status line.' }
            2       { 'ABORT (exit 2) - the suite did not complete, so nothing about the doctor was established by this run.' }
            255     { 'NOT RUN (exit 255) - tests\doctor_behaviour.ps1 could not be invoked.' }
            default { "UNKNOWN (exit $code) - outside the documented 0/1/2 contract." }
          }

          if ($code -eq 0) {
            Write-Host "doctor behaviour suite: $label"
          } else {
            Write-Host "::error title=Doctor behaviour suite::$label"
          }
          if ($env:GITHUB_STEP_SUMMARY) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "**Doctor behaviour suite:** $label"
          }
          exit $code

      - name: Toggle write-path suite
        shell: powershell
        run: |
          # The step that exercises the second thing in this plugin that WRITES
          # to a file an operator owns. bin\lwg-toggle.ps1 backs
          # /lw-watchtower:delegate, :plain and :verbosity and it writes
          # config.json; nothing in tests\ had ever driven that write.
          # tests\gate_delegate.ps1 exercises the READER of interaction.delegate
          # end to end - the writer was covered by nothing at all, which is why
          # three defects in it survived being read several times:
          #
          #   the write was a bare truncating [IO.File]::WriteAllText - no
          #   backup, no re-check that the file on disk is still the one that was
          #   read, and a hardcoded no-BOM encoding, where bin\lwg-config.ps1
          #   routes the same file through Save-LwgTextFile and gets all three;
          #
          #   on a config.json that ALREADY does not parse, the toggle edited the
          #   broken text, failed to parse the result, blamed ITS OWN EDIT, and
          #   interpolated Windows PowerShell 5.1's ConvertFrom-Json message -
          #   which embeds the whole input - into operator output;
          #
          #   a config.json with no top-level `modules` block made the toggle
          #   WRITE the file and then exit 3, while the script's own header and
          #   commands\delegate.md, plain.md and verbosity.md all define exit 3
          #   as "config.json was not changed".
          #
          # Every case runs in a real child process against a BYTE COPY of bin\
          # and lib\ under a scratch plugin root built at runtime from the temp
          # root, with config.json seeded per case. The toggle resolves its own
          # config as (Split-Path -Parent $PSScriptRoot)\config.json, so a copied
          # tree redirects the write with no seam - which is what lets the cases
          # run unchanged against the pre-fix baseline. USERPROFILE and
          # CLAUDE_PLUGIN_DATA are redirected and the two plugin-root variables
          # cleared around every child; without that swap every run would append
          # to the OPERATOR'S event log, since several fixtures hold a
          # non-boolean flag on purpose and that reaches Write-LwgInvalidFlag.
          #
          # ONE ENVIRONMENT TRAP, recorded because it is this step's to hit: if
          # the shell that launches the suite carries a PowerShell 7
          # PSModulePath, the 5.1 children cannot resolve Get-FileHash and EVERY
          # toggle run exits 3 with "config.json could not be read". This job
          # sets `shell: powershell` at the `defaults.run` level, so the children
          # here are launched from 5.1; a job launched from pwsh would see it.
          #
          # WHAT A GREEN RUN DOES NOT MEAN, carried from the suite header rather
          # than advertised away: it establishes NOTHING about the bounded parser
          # message on a file that parsed BEFORE the edit, about the pre-write
          # resolution of the edited TEXT (it sits behind a refusal that fires
          # first on every input that would reach it), or about the post-write
          # read-back handler, which needs a second writer inside a window of a
          # few milliseconds and which no case constructs. `-Scope repo` IS NOT
          # COVERED AND THAT IS A GAP RATHER THAN A DECISION - the scratch
          # working directory is deliberately not a git repository, so every
          # repo-scoped run exits 2 at the slug check before it reaches the
          # write. EIGHT of the cases are labelled CONTROL and pass before the
          # fix as well as after it; two more pass at the baseline for their own
          # reasons and the header names them, so a reader counting greens in a
          # red run does not read either as coverage.
          #
          # Same capture pattern as the steps around it: a nonzero native exit
          # code does NOT fail a PowerShell step on its own, so it is re-raised
          # explicitly, and stderr is deliberately not merged with 2>&1 - in
          # Windows PowerShell 5.1 that wraps native stderr in NativeCommandError
          # records and corrupts the result.
          $ErrorActionPreference = 'Continue'
          $suite = 'tests\toggle_behaviour.ps1'

          if (-not (Test-Path -LiteralPath $suite -PathType Leaf)) {
            Write-Host "::error::$suite is missing - the toggle's write was never exercised, which is not the same as passing"
            exit 1
          }

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $suite
          $code = if ($null -eq $LASTEXITCODE) { 255 } else { $LASTEXITCODE }

          # Exit-code contract of tests\toggle_behaviour.ps1, the same three this
          # repo's other suites use. An abort is never reported as a pass.
          #   0  every case passed
          #   1  at least one case failed
          #   2  the suite aborted, or a case could not be made conclusive; the
          #      write was NOT exercised. Zero cases run is an abort, never an
          #      empty-set pass.
          $label = switch ($code) {
            0       { 'PASS - the toggle still takes a backup, still re-checks the file it is about to replace, still keeps a BOM, still refuses a config it cannot read back, and no run that changed the file returned exit 3. That is the WRITE path on a scratch tree: `-Scope repo` is not reached by any case, and the post-write read-back handler is unreachable without a second writer.' }
            1       { 'FAIL (exit 1) - the toggle did not behave as declared. Read the per-case lines above. A case reporting exit 3 on a file that CHANGED means /lw-watchtower:delegate tells an operator nothing was written when something was, and a missing backup means a hand-edited config.json can be lost outright.' }
            2       { 'ABORT (exit 2) - the suite did not complete, or a case could not be made conclusive, so nothing about the toggle''s write was established by this run.' }
            255     { 'NOT RUN (exit 255) - tests\toggle_behaviour.ps1 could not be invoked.' }
            default { "UNKNOWN (exit $code) - outside the documented 0/1/2 contract." }
          }

          if ($code -eq 0) {
            Write-Host "toggle write-path suite: $label"
          } else {
            Write-Host "::error title=Toggle write-path suite::$label"
          }
          if ($env:GITHUB_STEP_SUMMARY) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "**Toggle write-path suite:** $label"
          }
          exit $code

      - name: SubagentStart fast-scan suite
        shell: powershell
        run: |
          # The step that exercises the hook every subagent dispatch of every
          # session pays for, and the first thing in this job to reach
          # context_injection at all.
          #
          # lib\subagent_start.ps1 does NOT parse config.json. It reads its own
          # flag out of the raw text, because ConvertFrom-Json costs 141-182 ms
          # in a fresh Windows PowerShell 5.1 process. That duplication is
          # deliberate and documented in the file's own header, and it is correct
          # only while the span it scans is the GLOBAL `modules` block.
          # Get-LwgJsonObjectSpan had no notion of DEPTH: it returned the first
          # `"modules":` in document order at ANY nesting level, and config.json's
          # `repos` block is documented to hold per-repo `modules` objects. So a
          # config with `repos` written above `modules` injected into the worker
          # while /lw-watchtower:status, the SessionStart banner and
          # Test-LwgModule all agreed the module was off - a raw-text scanner
          # whose correctness depended on which of two sibling keys appears first
          # in a file operators are invited to hand-edit.
          #
          # NO BARE NEGATIVE STANDS ALONE, which is the rule every case here
          # follows and the reason the case count is small. "It did not inject"
          # is satisfied by a hook that crashed, by a missing facts file and by a
          # fixture that never reached the branch, so every case asserting
          # silence runs the SAME fixture a second time with ONE BIT changed and
          # requires the injection to appear. The pair is the evidence; neither
          # half is.
          #
          # Each case pipes a payload into a real child process against the real
          # lib\subagent_start.ps1 - the file hooks\hooks.json registers - because
          # the hook drains stdin with [Console]::In.ReadToEnd() and a child that
          # inherited an open stdin would block rather than fail.
          # CLAUDE_PLUGIN_ROOT points at a throwaway root holding the fixture
          # config.json and a fixture context\worker_facts.md, and
          # CLAUDE_PLUGIN_DATA is redirected for EVERY child without exception:
          # the hook's catch path dot-sources lib\common.ps1 and calls
          # Write-LwgEvent, so a case that forgot the redirect would write into
          # the operator's own state directory on every failure.
          #
          # WHAT IT DOES NOT COVER, from the suite header: the escalation's SLUG
          # RESOLUTION - which repo a real payload resolves to is Get-LwgRepo's
          # job and is not re-tested here; the CONTENT and FORMATTING of
          # worker_facts.md, since every fixture uses an invented one-line file
          # and the comment-stripping and 2000-character ceiling have no case;
          # and THE PERFORMANCE BUDGET, which is the whole reason the fast path
          # exists - this suite asserts on ANSWERS, not on milliseconds, so a
          # green run is not evidence the hook is still fast.
          #
          # Same capture pattern as the steps around it: a nonzero native exit
          # code does NOT fail a PowerShell step on its own, so it is re-raised
          # explicitly, and stderr is deliberately not merged with 2>&1 - in
          # Windows PowerShell 5.1 that wraps native stderr in NativeCommandError
          # records and corrupts the result.
          $ErrorActionPreference = 'Continue'
          $suite = 'tests\subagent_scan.ps1'

          if (-not (Test-Path -LiteralPath $suite -PathType Leaf)) {
            Write-Host "::error::$suite is missing - the SubagentStart fast scan was never exercised, which is not the same as passing"
            exit 1
          }

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $suite
          $code = if ($null -eq $LASTEXITCODE) { 255 } else { $LASTEXITCODE }

          # Exit-code contract of tests\subagent_scan.ps1, the same three this
          # repo's other suites use. An abort is never reported as a pass.
          #   0  every case passed
          #   1  at least one case failed
          #   2  the suite aborted; the fast scan was NOT exercised. Zero cases
          #      run is an abort, never an empty-set pass.
          $label = switch ($code) {
            0       { 'PASS - the fast scan answers the GLOBAL flag whatever order the top-level keys appear in, and it agrees with the slow path it exists to avoid. That is a statement about the ANSWER only: nothing here re-measures the milliseconds the duplication was written for, and which repo a real payload resolves to is not re-tested.' }
            1       { 'FAIL (exit 1) - the fast scan and the module''s declared state disagree. Read the per-case lines above. A case that injected while the global flag was off means a module every other surface reports as off is still running in every worker dispatch.' }
            2       { 'ABORT (exit 2) - the suite did not complete, so nothing about the fast scan was established by this run.' }
            255     { 'NOT RUN (exit 255) - tests\subagent_scan.ps1 could not be invoked.' }
            default { "UNKNOWN (exit $code) - outside the documented 0/1/2 contract." }
          }

          if ($code -eq 0) {
            Write-Host "subagent fast-scan suite: $label"
          } else {
            Write-Host "::error title=SubagentStart fast-scan suite::$label"
          }
          if ($env:GITHUB_STEP_SUMMARY) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "**SubagentStart fast-scan suite:** $label"
          }
          exit $code

      - name: Payload disclosure guard
        shell: powershell
        run: |
          # The step that asks what a STRANGER receives. `.claude-plugin
          # \marketplace.json` declares `"source": "./"`, there is no exclusion
          # mechanism on that form, so EVERY TRACKED FILE IN THIS REPOSITORY IS
          # THE SHIPPED PAYLOAD - and `/lw-watchtower:checklist` renders one of
          # those files on the consumer's machine, because commands\checklist.md
          # instructs the model to print the output verbatim.
          #
          # Four disclosures reached the payload that way and NOTHING CAUGHT ANY
          # OF THEM, because every other guard in tests\ answers a different
          # question - and that is the argument for this step existing rather
          # than widening one of the others:
          #
          #   tests\portability_scan.ps1 asks whether a tracked file names one
          #   MACHINE. A pull ref, a commit SHA and a release-plan heading are
          #   portable, so they pass it.
          #
          #   tests\doc_claims.ps1 derives COUNTED QUANTITIES and holds prose to
          #   them. A containment claim resting on the repository not being
          #   published yet carries no number, so it is not a claim that file can
          #   read at all.
          #
          #   tests\evidence_states.ps1 reads rules, not prose, and is
          #   indifferent to what a caveat says.
          #
          # So the disclosures were found by AUDIT, and an audit is a person
          # remembering to look - the three that found these had to be told
          # where. This is the same check run by a machine, over the same file
          # list the marketplace copies.
          #
          # ONE OF ITS RULES GUARDS A SENTENCE THAT IS CORRECT TODAY, and that is
          # the point rather than an overreach. A containment claim resting on
          # who can currently reach this repository holds now and becomes a FALSE
          # SAFETY CLAIM about an unresolved PII exposure the moment visibility
          # changes - inside a file that is public by then. The change is a single
          # event nobody will re-read the file after.
          #
          # THIS PARAGRAPH DESCRIBES THAT RULE WITHOUT WRITING THE SHAPE IT
          # MATCHES, and that is not squeamishness. The rule keys on a literal
          # phrasing; spelling it here would trip the guard from inside the CI
          # step that runs it, which is how this comment was FIRST WRITTEN and
          # what took the suite to 14 of 15 before it was corrected. The suite's
          # own header takes the same care for the same reason, and this
          # repository has already shipped a prose example that matched the sweep
          # hunting for the thing it described.
          #
          # THE FILE LIST IS NEVER HARDCODED. It is whatever `git ls-files`
          # reports, for the same reason the JSON step above enumerates that way,
          # and here it is load-bearing rather than stylistic: `"source": "./"` is
          # a wildcard nobody enumerated, which is exactly how the payload
          # boundary was lost in the first place.
          #
          # SELF-EXEMPTION, and it is not a wholesale skip. The guard must
          # contain the strings it forbids, so its exempt lines are bracketed by
          # a region marker and only the owner path may declare one - a marker
          # appearing in any other tracked file is itself reported as a
          # violation, so the mechanism cannot become an escape hatch. A hit that
          # a BARRED LEDGER entry covers is PRINTED with its issue number above
          # the result and never folded silently into a pass: a ledger entry
          # means the named issue owns the site, not that the site is acceptable.
          #
          # WHAT IS NOT SCANNED IS NOT CLEAN. A tracked path with nothing on
          # disk, or a file whose first 8 KB holds a NUL byte, is NAMED and exits
          # 2 - which is why the label below separates that from a clean run.
          #
          # Same capture pattern as the steps around it: a nonzero native exit
          # code does NOT fail a PowerShell step on its own, so it is re-raised
          # explicitly, and stderr is deliberately not merged with 2>&1 - in
          # Windows PowerShell 5.1 that wraps native stderr in NativeCommandError
          # records and corrupts the result.
          $ErrorActionPreference = 'Continue'
          $suite = 'tests\payload_guard.ps1'

          if (-not (Test-Path -LiteralPath $suite -PathType Leaf)) {
            Write-Host "::error::$suite is missing - the shipped payload was never checked, which is not the same as passing"
            exit 1
          }

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $suite
          $code = if ($null -eq $LASTEXITCODE) { 255 } else { $LASTEXITCODE }

          # Exit-code contract of tests\payload_guard.ps1, the same three this
          # repo's other suites use. An abort is never reported as a pass, and 2
          # takes precedence over 1.
          #   0  every tracked file was read and no unledger'd disclosure found
          #   1  at least one disclosure is in the payload at a site no ledger
          #      entry covers - the payload discloses, and the site is named
          #   2  the scan aborted, could not read every tracked file, or an owner
          #      file left a region open. The tree was NOT fully checked.
          $label = switch ($code) {
            0       { 'PASS - every tracked file was read and none carries an unledger''d disclosure. That is a statement about the SHAPES THIS GUARD CARRIES - a pull-ref narrative, the former personal address, a plan file name, a release-plan heading and a visibility-conditioned containment claim - not that the payload is free of everything a reader would rather not ship.' }
            1       { 'FAIL (exit 1) - a tracked file discloses at a site no ledger entry covers, and every tracked file is the shipped payload. Read the file:line list above. Fix the FILE; a ledger entry is not an approval, it is a statement that a named issue owns the site.' }
            2       { 'ABORT (exit 2) - the scan did not read every tracked file, so it cannot say the payload is clean. Read the NOT SCANNED lines above: a tracked path with nothing on disk, a file whose first 8 KB holds a NUL byte, or an owner file that left a region marker open. Violations found alongside are still listed and still real.' }
            255     { 'NOT RUN (exit 255) - tests\payload_guard.ps1 could not be invoked.' }
            default { "UNKNOWN (exit $code) - outside the documented 0/1/2 contract." }
          }

          if ($code -eq 0) {
            Write-Host "payload disclosure guard: $label"
          } else {
            Write-Host "::error title=Payload disclosure guard::$label"
          }
          if ($env:GITHUB_STEP_SUMMARY) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "**Payload disclosure guard:** $label"
          }
          exit $code

      - name: Portability scan
        shell: powershell
        run: |
          # This plugin is written on one machine and runs on others, and three
          # shipped defects were one laptop's private facts stated as universal
          # truth: a status line that rendered "not installed" forever wherever
          # the layout differed, machine facts injected verbatim into every
          # subagent, and a security module whose agent-name arrays matched
          # nothing on a fresh install. Each was caught by an audit - a person
          # remembering to look. tests\portability_scan.ps1 is the same check
          # run by a machine on every build. The mandate is docs\portability.md.
          #
          # It enumerates with `git ls-files` for the same reason the JSON step
          # above does: a hardcoded file list is the exact defect the scan
          # exists to prevent.
          #
          # Same capture pattern as the step above: a nonzero native exit code
          # does NOT fail a PowerShell step on its own, so it is re-raised
          # explicitly. stderr is deliberately not merged with 2>&1 - in Windows
          # PowerShell 5.1 that wraps native stderr in NativeCommandError
          # records and corrupts the result.
          $ErrorActionPreference = 'Continue'
          $scan = 'tests\portability_scan.ps1'

          if (-not (Test-Path -LiteralPath $scan -PathType Leaf)) {
            Write-Host "::error::$scan is missing - the portability scan never ran, which is not the same as passing"
            exit 1
          }

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $scan
          $code = if ($null -eq $LASTEXITCODE) { 255 } else { $LASTEXITCODE }

          # Exit-code contract of tests\portability_scan.ps1. There is
          # deliberately no "passed with a caveat": a tracked file either
          # carries a local environment dependency or it does not - and a
          # tracked file the scan could not READ is neither, which is why it
          # goes to 2 and not to 1.
          #   0  every tracked file was read, nothing machine-specific found
          #   1  at least one violation
          #   2  the scan aborted, OR a tracked file was not fully read - not
          #      on disk, unreadable as text, or behind an unclosed exempt
          #      region. Two channels used to print a line about that and then
          #      leave the exit code alone, so exit 0 asserted "every tracked
          #      file was scanned" about runs that had skipped files. An
          #      enumeration returning zero files is an abort, never an
          #      empty-set pass, and 2 takes precedence over 1.
          $label = switch ($code) {
            0       { 'PASS - every tracked file was read and none carries a local environment dependency.' }
            1       { 'FAIL (exit 1) - a tracked file names a machine: an account, a host, a profile path, an absolute interpreter path or a hardcoded install location. Fix the file. Do NOT add an allowlist entry unless the match is genuinely portable, and if it is, state the reason on the entry - see docs\portability.md.' }
            2       { 'ABORT (exit 2) - the scan did not read every tracked file, so it cannot say the tree is clean. Read the NOT SCANNED / PARTLY SCANNED lines above: each names the file and the reason. A UTF-16 file - which is what > and Out-File write by default in Windows PowerShell 5.1 - lands here and should be re-saved as UTF-8, not exempted. Violations found alongside are still listed and still real.' }
            255     { 'NOT RUN (exit 255) - tests\portability_scan.ps1 could not be invoked.' }
            default { "UNKNOWN (exit $code) - outside the documented 0/1/2 contract." }
          }

          if ($code -eq 0) {
            Write-Host "portability scan: $label"
          } else {
            Write-Host "::error title=Portability scan::$label"
          }
          if ($env:GITHUB_STEP_SUMMARY) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "**Portability scan:** $label"
          }
          exit $code

      - name: Documentation claims
        shell: powershell
        run: |
          # THE ONLY STEP HERE THAT CHECKS THE PROSE. Every other step asks
          # whether the code is right; this asks whether the pages are, because
          # on this repository the pages ARE the product - its single promise is
          # that it never overstates itself.
          #
          # It exists because a checkable quantity could be wrong in ten tracked
          # files at once with nothing to catch it. Two adversarial UAT passes
          # found README.md contradicting ITSELF six lines apart on test
          # coverage, three pages stating a doctor check count the doctor does
          # not have, and a limitations page whose own table refuted its own
          # conclusion in the next paragraph. Every one of them was written by
          # somebody reading a sibling sentence rather than the tree.
          #
          # NOTHING IN THE SUITE IS HARDCODED, and that is the point: a guard
          # carrying its own copy of the expected numbers is a ninth place for
          # them to be wrong. It counts tests/ and commands/ with git ls-files,
          # counts the `shell: powershell` steps in THIS FILE, parses
          # $LwgModuleRegistry out of lib\common.ps1, runs bin\lwg-doctor.ps1 to
          # read its check count, and RUNS every sibling suite to read the case
          # tally each one prints about itself - which is also how it decides
          # which of them are behavioural at all, rather than being told.
          #
          # THAT RE-RUN IS DELIBERATE AND ITS COST IS BOUNDED. The suites run in
          # parallel, each in its own child process against its own GUID scratch
          # tree under the temp root, so the wall cost is the SLOWEST suite
          # rather than the sum - 236 s measured across eleven jobs, against
          # roughly 598 s if they ran in series. Reading a number the suites already printed in
          # the steps above was rejected: it would mean either editing those
          # steps to export it or hardcoding it here, and both put the answer
          # somewhere it can drift from the suite that owns it.
          #
          # A sentence that is genuinely a record of a date is exempted by a
          # marker in the file itself: an HTML comment carrying doc-claims:ignore
          # on the offending line or the one above it, or the same token with
          # -file appended anywhere in a file that is a record end to end.
          # CHANGELOG.md and docs\uat-report.md carry the file-level form and say
          # why at the top. The delimiters are required precisely so that this
          # comment, which NAMES the markers, does not thereby invoke them - it
          # exempted this whole file the first time it was written without them.
          # Reach for a marker only when the number is FROZEN HISTORY.
          #
          # Same capture pattern as the steps around it: a nonzero native exit
          # code does NOT fail a PowerShell step on its own, so it is re-raised
          # explicitly, and stderr is deliberately not merged with 2>&1 - in
          # Windows PowerShell 5.1 that wraps native stderr in NativeCommandError
          # records and corrupts the result.
          $ErrorActionPreference = 'Continue'
          $suite = 'tests\doc_claims.ps1'

          if (-not (Test-Path -LiteralPath $suite -PathType Leaf)) {
            Write-Host "::error::$suite is missing - no documentation claim was checked, which is not the same as passing"
            exit 1
          }

          # -SuiteTimeoutSec IS PASSED, AND IT IS NOT A STYLE CHOICE. This suite
          # waits that long for its parallel sibling run and, on expiry, aborts
          # with exit 2 naming the suite that did not finish. Its default was
          # 900 s against this job's ten-minute cap, so the cap always won: the
          # step is marked CANCELLED rather than failed, the `exit $code` line
          # below is never reached, no ::error annotation is emitted and nothing
          # is written to the job summary. The build went red either way - what
          # was lost was every word of the diagnostic, on a repository whose
          # exit-code tables are written out three times over for that moment.
          #
          # 600 s against a 1800 s job budget, and BOTH are unchanged by the four
          # suites added since. The healthy parallel run was re-MEASURED at 236 s
          # across ELEVEN jobs on one developer machine - see the table in the job
          # comment above - so this is roughly 2.5x the observed time, which is
          # headroom for a hosted runner slower than that machine without being so
          # loose that the abort never fires. Four more jobs did not move it
          # because tests\setup_merge.ps1 is still the slowest and none of the new
          # suites comes near it; the wall clock is the slowest job, not the
          # count. It is NOT the 240
          # first written here: that was picked from this file's own stale prose
          # saying the parallel run took "about a minute", and 240 s would have
          # aborted a HEALTHY tree by nine seconds. Re-measure before tightening
          # it, and remember the suites are still growing - a new suite slower
          # than setup_merge is what moves this number, not a new suite as such.
          # The two numbers are
          # now BOUND rather than merely consistent:
          # tests\doc_claims.ps1 reads timeout-minutes out of this file and this
          # argument out of this line, and fails if the wait is not strictly
          # inside the budget. Raising one without the other is caught.
          #
          # WHAT THIS DOES NOT FIX: a hang in any of the thirteen steps ABOVE. Those
          # still burn the job budget and still end in a cancellation with no
          # diagnostic. Per-step timeout-minutes is the general answer and is not
          # done here - a timed-out step is killed before its own `exit $code`
          # runs, so it names the step in the UI but still loses the script's
          # message, which is a different fix for a different problem.
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $suite -SuiteTimeoutSec 600
          $code = if ($null -eq $LASTEXITCODE) { 255 } else { $LASTEXITCODE }

          # Exit-code contract of tests\doc_claims.ps1, the same three this repo's
          # other suites use. An abort is never reported as a pass, and neither is
          # a run that skipped the suite tallies.
          #   0  every recognised claim agrees with the tree
          #   1  at least one claim disagrees
          #   2  a derivation failed, a PATTERN checked nothing, or -SkipSuites
          #      was passed; the claims were NOT checked. Zero claims found is an
          #      abort, never an empty-set pass - a pattern set that matches
          #      nothing is broken, not clean, and since 3 August 2026 that is
          #      enforced per PATTERN rather than only on the grand total. Seven
          #      of its thirty-seven patterns were dead at that point and the
          #      total never noticed, because reaching zero needed every rule in
          #      the file to go blind at once.
          $label = switch ($code) {
            0       { 'PASS - no documented count of suites, cases, CI steps, doctor checks, commands or modules disagrees with the tree, every pattern in the guard checked at least one claim, and the non-quantity rules held. That is a statement about the PHRASINGS THIS GUARD RECOGNISES, listed in the suite header: a new way of writing "there are five suites" is invisible to it until a pattern is added, and no number here is evidence that the sentence around it is true.' }
            1       { 'FAIL (exit 1) - a tracked document states a quantity the tree contradicts, or one of the non-quantity rules failed. Read the file:line list above; each one prints what the page says, what the tree says, and how the tree''s answer was derived. Fix the SENTENCE. If it is a record of what was true on a date, mark that line doc-claims:ignore and leave the number alone - do NOT edit the guard.' }
            2       { 'ABORT (exit 2) - the guard did not complete, so nothing about the documentation was established by this run. Two causes read differently and the output says which: a sibling suite that exited nonzero aborts this one on purpose, because a case tally from a failing suite is not a fact; and a pattern that checked no claim anywhere is reported dead by name, because a rule that cannot fire is not a rule. Repoint or delete the pattern - do not allowlist it.' }
            255     { 'NOT RUN (exit 255) - tests\doc_claims.ps1 could not be invoked.' }
            default { "UNKNOWN (exit $code) - outside the documented 0/1/2 contract." }
          }

          if ($code -eq 0) {
            Write-Host "documentation claims: $label"
          } else {
            Write-Host "::error title=Documentation claims::$label"
          }
          if ($env:GITHUB_STEP_SUMMARY) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "**Documentation claims:** $label"
          }
          exit $code
