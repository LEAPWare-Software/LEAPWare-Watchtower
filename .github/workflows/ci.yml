name: CI

# LW-WATCHTOWER is a Windows PowerShell 5.1 plugin and its checks are not portable.
# tests\portability_scan.ps1 needs a binary literally named `powershell` (pwsh is
# NOT the same thing) and -ExecutionPolicy, which is Windows-only. So: one OS, no
# matrix, and every step runs under Windows PowerShell 5.1 rather than the `pwsh`
# (PowerShell 7) that GitHub's Windows runners default to.
#
# THERE IS ONE JOB, AND NINE OF ITS FOURTEEN CHECK STEPS TEST BEHAVIOUR. The
# `gate-regression` job and tests\gate_regression.ps1 went on 30 July 2026 with
# the destructive command gate; the `permissions.deny parity` step and
# tests\deny_parity.ps1 went the same day with the secret gate. Neither is coming
# back as it was - nothing here inspects a shell command or a credential, and the
# installer writes no deny rules. What HAS come back is the half of the parity
# test that was never about deny rules: the installer's merge behaviour, now
# exercised on the statusline section by tests\setup_merge.ps1, which also covers
# what the hooks section DECIDES - install-mode detection and root-independent
# hook identity - and the status line's own plugin-root resolution.
#
# What runs now: every tracked .json and every .ps1 PARSE; no tracked file names
# one machine; every file under .github\workflows\ is parsed and held to the
# workflow guard's nine rules, and the rest of .github\ - dependabot.yml and the
# issue-template files, which GitHub reads at run time and which no step here
# read until 3 August 2026 - is PARSED ONLY, so a syntax error in one of them
# fails the build while a schema mistake in one still does not; the guard is
# also driven against fixtures built to violate each of its rules, because
# until that date it had only ever been run on a clean tree, where the expected
# answer is 0 and the branch that fires is never taken;
# tests\gate_delegate.ps1 exercises delegate_gate, the one gate
# this plugin ships, through a real pipe into a real child process; and
# tests\setup_merge.ps1 drives bin\lwg-setup.ps1 against throwaway settings files
# to check that the one thing in this plugin that WRITES to an operator's machine
# preserves what it was not asked to touch; tests\stop_behaviour.ps1 runs
# lib\stop_advisories.ps1 and lib\supervisor.ps1 in real child processes, which
# is the first thing here to exercise an OBSERVING module rather than the gate;
# tests\uninstall_footprint.ps1 drives bin\lwg-uninstall.ps1 against throwaway
# data directories to check that the one thing in this plugin that DELETES
# removes exactly what its footprint said it would, and refuses to report a
# no-op deletion as a success; and tests\evidence_states.ps1 holds
# bin\lwg-evidence.ps1 to the distinction the whole checklist rests on - a probe
# that RAN and found nothing, versus a probe that never got to look - against a
# plugin root with no .git, which is the marketplace install route and is where
# that distinction shipped broken; tests\doctor_behaviour.ps1 drives
# bin\lwg-doctor.ps1 against seeded configs and seeded settings.json files, on
# two of its nine checks and no others, because until it landed nothing had ever
# RUN the component whose whole job is to notice a switch wired to nothing;
# tests\toggle_behaviour.ps1 drives bin\lwg-toggle.ps1's WRITE to config.json,
# the second thing here that edits a file an operator owns and the one that had
# no coverage of any kind; tests\subagent_scan.ps1 pipes payloads into
# lib\subagent_start.ps1 to hold its raw-text fast path to the GLOBAL `modules`
# block whatever order the top-level keys appear in, which is the first coverage
# of any kind for context_injection; tests\payload_guard.ps1 reads every file
# `git ls-files` reports - which is the whole shipped payload, because
# marketplace.json declares `"source": "./"` and that form has no exclusion
# mechanism - for disclosures no other guard here can see; and
# tests\doc_claims.ps1 holds every tracked
# page to the tree on the quantities it states, because a count could be wrong
# in ten files at once with nothing to catch it.
# A green run says the repo is syntactically sound, portable, that no workflow
# reaches a runner GitHub does not host, that the gate still refuses what it
# declares, that the statusline merge still behaves, that those stop-path cases
# still behave, that the uninstaller's state-data footprint is true, that the
# checklist does not report a state it never observed, that two of the doctor's
# nine checks still ask the question they claim to, that the toggle's write
# still backs up and still re-checks the file it replaces, that the SubagentStart
# fast path still answers the global flag, that no tracked file carries a
# disclosure this guard knows the shape of, and that no page states a
# recognised count the tree contradicts. It says nothing about the gate being
# SOUND - see the note on that step, and docs\gates-removed.md Lesson 3.
#
# THE NEXT THREE CLAUSES WERE FLAT WRONG UNTIL 3 AUGUST 2026 and are narrowed
# rather than deleted, because the narrow version is still worth saying. This
# list read "nothing about the hooks or permissions sections of the installer,
# which go through the same writer and are not exercised, nothing about the
# uninstaller's settings.json edits or its restore path" - and the hooks half
# contradicted line 17 of this same file, which says the merge suite covers what
# that section DECIDES. What is true now: the hooks section's DECISIONS are
# exercised (install-mode detection, root-independent hook identity, and that
# the value the diff discloses is the value that lands); the permissions
# section's DIFF is exercised and its MERGE is not; the uninstaller's RESTORE
# path has two cases, and its deny-rule ATTRIBUTION is exercised in dry run
# while the settings.json edit those rules imply is not. The byte-level WRITE
# behaviour of every section other than statusline still rests on the fact that
# they share one writer, which is an argument and not a test. Also: nothing
# about the ATOMICITY of that write, which no case reaches. Nothing about whether a sentence
# whose NUMBERS check out is true in any other respect, and nothing about the
# TWO observing modules no suite in this job reaches at all - verification_gate
# and self_health.
#
# THAT NUMBER HAS NOW MOVED TWICE AND THE COUNT IS OF MODULES NOTHING RUNS, NOT
# OF MODULES. It said SEVEN until 3 August 2026, when cases for context_pressure,
# docs_coupling, git_hygiene and log_rotation landed in tests\stop_behaviour.ps1
# and this line was not swept with them; it said THREE - and named
# context_injection as the third - until tests\subagent_scan.ps1 landed and drove
# lib\subagent_start.ps1, which is that module's implementation, in a real child
# process. Read the change for exactly what it is: context_injection is now
# REACHED, on the question of whether its fast path answers the global flag. Its
# worker_facts.md handling - the comment-stripping and the 2000-character ceiling
# - still has no case anywhere, and that suite's header says so. Nothing in
# tests\ derives which modules a suite exercises, so this line is held by review
# and by nothing automatic; tests\doc_claims.ps1 names that hole in its own
# header rather than implying it covers this.

on:
  push:
    # THERE IS DELIBERATELY NO PATH FILTER HERE, AND ADDING ONE IS A REGRESSION.
    # A filter sits on the trigger, not on a job, so when it matches it skips
    # the ENTIRE workflow - every step, not just the ones the changed file
    # plausibly affects. This trigger carried `paths-ignore: ['**.md']` until
    # 31 July 2026, on the reasoning that a README edit changes no gate and no
    # JSON. That reasoning went stale when the portability scan landed: the
    # scan reads EVERY TRACKED FILE, .md included, and a machine-specific path
    # turns up in prose more often than in code. The HANDOFF.md push of 30 July
    # 2026 ran no CI at all - precisely the case the scan exists to catch.
    #
    # Narrowing the filter rather than deleting it would not be correct either.
    # The scan's input is the whole tracked tree, so the only set of paths that
    # provably reaches no check is the empty set; any filter is a list someone
    # has to keep in step with what the steps read, which is the same drift the
    # `git ls-files` enumerations below were written to avoid.
    #
    # pull_request has never had a path filter and must not be given one, for a
    # different reason: a path filter there makes the job never report a status
    # at all, which would leave a README-only PR blocked forever on a required
    # check that never runs. PRs always run, so this check is always reportable.
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: powershell

jobs:
  # The whole workflow. It was one of two jobs until the gate regression suite
  # was removed on 30 July 2026, and it stays one job now that NINE behavioural
  # suites are in it: a second job would buy parallelism this workflow does not
  # need at the cost of a second required check to configure. The parse steps
  # are still sub-second; the suites are the part that is not, because each
  # spawns a child PowerShell process per case - the uninstaller one spawns two
  # for several of its cases - and that is the point of them.
  #
  # THE TIMINGS BELOW WERE MEASURED, AND THE ONES THEY REPLACE WERE FOUR TIMES
  # OUT. This comment said the gate suite ran "in about half a minute", the
  # merge suite "in under a minute", the stop-hook suite "in about twenty
  # seconds" and the parallel re-run "about a minute" - figures from when those
  # suites were much smaller. Re-measured when the four new suites landed, on
  # ONE developer machine, by running each sibling one after another the way the
  # steps below drive them:
  #
  #     tests\setup_merge.ps1            262 s
  #     tests\uninstall_footprint.ps1     94 s
  #     tests\gate_delegate.ps1           71 s
  #     tests\stop_behaviour.ps1          70 s
  #     tests\doctor_behaviour.ps1        31 s
  #     tests\toggle_behaviour.ps1        27 s
  #     tests\evidence_states.ps1         21 s
  #     tests\subagent_scan.ps1            9 s
  #     tests\payload_guard.ps1            7 s
  #     tests\portability_scan.ps1         4 s
  #     tests\workflow_guard.ps1           2 s   (+12 s for -SelfTest, same step)
  #     parallel wall clock, 11 jobs     236 s
  #
  # ONE MACHINE, NOT THE RUNNER. These are not GitHub's hosted Windows numbers
  # and nothing here has measured those; they are stated so the budget rests on
  # an observation rather than on prose nobody re-ran. Read them as an order of
  # magnitude and re-measure before tightening anything.
  #
  # TWO OF THESE ARE NOT COMPARABLE WITH THE ROW THEY REPLACE, and saying so is
  # the difference between a measurement and a number. The gate suite read 179 s
  # in the previous table and 71 s here, and that is NOT the machine being
  # faster: eight of its section-K cases currently fail on a missing fixture
  # dependency and fail FAST, so a tree where they run would cost more than 71 s
  # and nothing here has measured how much. The stop-hook suite fell from 149 s
  # to 70 s over the same interval with its case count RISING from 169 to 177,
  # which is not explained here either. Neither figure is load-bearing for the
  # budget below - the margin is wide enough that both could double - but
  # neither should be quoted as a like-for-like improvement.
  #
  # THE ARITHMETIC, AND WHY timeout-minutes IS NOT RAISED. The eleven sibling
  # invocations cost about 610 s IN SERIES as steps 4-14 (598 s of suites plus
  # the guard's 12 s self-test in the same step), and the documentation-claim
  # step then re-runs the same eleven in PARALLEL - costing the slowest, 236 s,
  # not the sum. That is about 846 s of suite time before the parse steps,
  # against a 1800 s budget: the healthy path uses under half of it and leaves
  # roughly 950 s of headroom.
  #
  # THE TOTAL WENT DOWN WHILE FOUR SUITES WERE ADDED, which is worth stating
  # plainly rather than leaving as a surprise. The previous revision measured
  # 695 s in series and 249 s in parallel, about 950 s together; the four new
  # suites add 74 s in series and nothing to the parallel wall clock, because
  # setup_merge is still the slowest job and none of them comes near it. The
  # 30-minute budget was set for the 950 s case and it still fits the 846 s one,
  # so raising it now would be raising a cap against no measurement. If the
  # parallel wall clock ever approaches the 600 s wait the documentation-claim
  # step passes, RAISE BOTH - see the rule below.
  #
  # DO NOT make the documentation-claim step trust a number typed into it. The
  # -SuiteTimeoutSec it is given is held BELOW this budget by a rule inside
  # tests\doc_claims.ps1 that reads both numbers off this file, so raising one
  # without the other fails the build rather than silently making that suite's
  # documented abort unreachable again.
  #
  # THE JOB ID AND ITS DISPLAY NAME ARE BOTH DELIBERATELY UNCHANGED, and the
  # display name is now narrower than what the job does. That is on purpose: a
  # required status check on main is matched by this NAME, so renaming it would
  # silently stop satisfying the requirement and leave every PR waiting on a
  # check that can no longer report. Rename it only together with the branch
  # protection setting - see checklist.json, P6-branch-protection.
  fast-checks:
    name: Fast checks (JSON + PowerShell parse)
    runs-on: windows-latest
    # 30, not 10 - see the measured timings above. tests\doc_claims.ps1 reads
    # this number and refuses a -SuiteTimeoutSec that is not strictly inside it.
    timeout-minutes: 30
    steps:
      # THE ONLY `uses:` IN THIS REPOSITORY, AND THE ONLY CODE HERE THAT COMES
      # FROM SOMEBODY ELSE. Two properties of the old `actions/checkout@v4` line
      # were worth closing even though neither was exploitable here:
      #
      #   * `@v4` IS A MUTABLE TAG, resolved at run time. Whoever controls that
      #     repository - or anyone who compromises it - can repoint v4 at a
      #     different tree, and every run from then on executes that tree.
      #     Nothing in this repository recorded which commit it had run, so
      #     `git log` here could not answer "what changed" when a green build
      #     went red under a routine upstream release. The digest below is the
      #     commit refs/tags/v4 pointed at on 3 August 2026, which is also
      #     refs/tags/v4.4.0. Dependabot understands digest pins and keeps
      #     proposing bumps with the tag in the trailing comment, so this costs
      #     no maintenance - see .github\dependabot.yml.
      #
      #   * `persist-credentials` DEFAULTS TO TRUE, which writes an
      #     AUTHORIZATION header into .git\config in the runner workspace where
      #     it stays for the rest of the job - fourteen steps, twelve of them
      #     invoking powershell.exe against a script in tests\. Nothing after this step
      #     uses git over the network: the checks run `git ls-files` and
      #     `git tag -l`, which need no credential. Turning it off is free here.
      #
      # WHAT THIS DOES NOT BUY, so the pin is not read as more than it is. The
      # blast radius was already small and that has not changed: `permissions:
      # contents: read` above means the persisted token could only read a
      # repository that is about to be public, and the runner is a disposable
      # GitHub-hosted VM. A digest pins WHAT RUNS, not what that code does - it
      # is not review of actions/checkout. And tests\workflow_guard.ps1 still
      # does not check either property: its header says so under WHAT IT DOES
      # NOT COVER, and a rule failing every non-digest `uses:` was deliberately
      # NOT added, because a bare tag is a policy preference and that guard's
      # exit-1 contract is reserved for real violations.
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: JSON validity
        shell: powershell
        run: |
          # Every tracked .json, not a hardcoded list. The old list named three
          # files by hand, so .claude-plugin/marketplace.json - added after it
          # was written - went unvalidated, and a syntax error there would have
          # reached main with this job green. `git ls-files` cannot drift from
          # the repo: a new .json is covered the moment it is tracked, and .git
          # is excluded by construction rather than by a filter someone has to
          # remember to maintain.
          $files = @(git ls-files -- '*.json' | Where-Object { $_ })
          if ($files.Count -eq 0) {
            # The enumeration returning nothing is itself a failure. Without
            # this, a broken `git ls-files` would validate zero files and the
            # step would report success - the empty-set pass this repo has
            # already been bitten by once.
            Write-Host "::error::no tracked .json files found - the enumeration is broken, not the repo"
            exit 1
          }
          $bad = 0
          foreach ($f in $files) {
            if (-not (Test-Path -LiteralPath $f -PathType Leaf)) {
              Write-Host "::error file=$f::missing"
              $bad++
              continue
            }
            $raw = Get-Content -Raw -LiteralPath $f
            if ([string]::IsNullOrWhiteSpace($raw)) {
              # ConvertFrom-Json accepts a null pipeline input silently, so an
              # empty file would otherwise pass this check.
              Write-Host "::error file=$f::empty"
              $bad++
              continue
            }
            try {
              $null = $raw | ConvertFrom-Json
              Write-Host "  ok    $f"
            } catch {
              Write-Host "::error file=$f::not valid JSON - $($_.Exception.Message)"
              $bad++
            }
          }
          if ($bad -gt 0) {
            Write-Host "JSON validity: $bad of $($files.Count) file(s) FAILED"
            exit 1
          }
          Write-Host "JSON validity: all $($files.Count) file(s) parsed"

      - name: PowerShell parse check
        shell: powershell
        run: |
          $root = (Get-Location).Path
          $files = @(
            Get-ChildItem -LiteralPath $root -Recurse -Filter *.ps1 -File |
              Where-Object { $_.FullName -notmatch '\\\.git\\' } |
              Sort-Object FullName
          )
          if ($files.Count -eq 0) {
            Write-Host "::error::no .ps1 files found - the glob is broken, not the repo"
            exit 1
          }
          $bad = 0
          foreach ($f in $files) {
            $rel = $f.FullName.Substring($root.Length + 1) -replace '\\', '/'
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $f.FullName, [ref]$tokens, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $bad++
              foreach ($e in $errors) {
                Write-Host ("::error file={0},line={1},col={2}::{3}" -f `
                  $rel, $e.Extent.StartLineNumber, $e.Extent.StartColumnNumber, $e.Message)
              }
            } else {
              Write-Host "  ok    $rel"
            }
          }
          if ($bad -gt 0) {
            Write-Host "PowerShell parse check: $bad of $($files.Count) file(s) FAILED to parse"
            exit 1
          }
          Write-Host "PowerShell parse check: all $($files.Count) file(s) parsed"

      - name: Workflow guard
        shell: powershell
        run: |
          # THIS STEP GUARDS THE FILE IT IS WRITTEN IN. Every file under
          # .github\workflows\ is parsed - not grepped - and fails the build if
          # it names a runner GitHub does not host, uses pull_request_target,
          # reaches a secret, or cannot be parsed at all.
          #
          # IT RUNS TWICE, AND THE SECOND RUN IS THE ONE WITH EVIDENCE BEHIND
          # IT. Until 3 August 2026 nothing in this repository ever ran the
          # guard against a workflow that violates any of its rules - the
          # checklist probe, this step and every invocation in CONTRIBUTING.md
          # pointed it at a clean tree, where the expected answer is 0. So the
          # branch that FIRES had no evidence at all, on the rule this project
          # ranks highest-consequence and describes in four places as something
          # that fails the build. -SelfTest writes one deliberately violating
          # workflow per rule into a throwaway directory under the temp root,
          # re-invokes the guard against it in a child process, and asserts each
          # rule fired on the file it was planted in; it also asserts the two
          # ends of the exit contract no live run reaches - a clean directory
          # exits 0, an empty or absent one exits 2.
          #
          # It is a second INVOCATION rather than a second STEP on purpose. A
          # tenth check step would move the ci-check-steps count that
          # tests\doc_claims.ps1 derives from this file and holds four documents
          # to, for no gain: both runs are the same guard and one failure of
          # either has to fail this step.
          #
          # WHAT THE SELF-TEST DOES NOT ESTABLISH: each rule is proved to fire
          # on ONE shape of input. The matrix branch is proved on a list of
          # literal labels, not on an include: entry or a fromJSON; the label
          # branch on one unknown label, not on the space of spellings. A rule
          # demonstrated to fire once is a floor, not a proof of correctness.
          #
          # The live run also now PARSES the rest of .github\ - dependabot.yml
          # and the five issue-template files, which GitHub reads at run time
          # and which no step here read until now. The nine rules are NOT
          # applied to them and parsing is not schema validation: it catches a
          # list item indented out of its sequence, not a `type:` value GitHub
          # does not recognise.
          #
          # The self-hosted rule is the reason it exists: this project's
          # maintainer has self-hosted runners registered, and a workflow that
          # reaches one hands whoever can trigger it code execution on a real
          # machine. It REPLACED an evidence rule that only required this file
          # to contain the string "self-hosted", which a comment satisfied -
          # and which would have gone on passing while a self-hosted runner was
          # introduced.
          #
          # It enumerates by globbing the directory rather than naming files,
          # for the same reason the JSON step above uses `git ls-files`.
          #
          # Same capture pattern as the steps around it: a nonzero native exit
          # code does NOT fail a PowerShell step on its own, so it is re-raised
          # explicitly. stderr is deliberately not merged with 2>&1 - in Windows
          # PowerShell 5.1 that wraps native stderr in NativeCommandError
          # records and corrupts the result.
          $ErrorActionPreference = 'Continue'
          $guard = 'tests\workflow_guard.ps1'

          if (-not (Test-Path -LiteralPath $guard -PathType Leaf)) {
            Write-Host "::error::$guard is missing - no workflow was checked, which is not the same as passing"
            exit 1
          }

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $guard
          $code = if ($null -eq $LASTEXITCODE) { 255 } else { $LASTEXITCODE }

          # The self-test, run only when the live scan was clean. Running it
          # regardless would put two unrelated diagnostics in one step's output
          # and make the exit code ambiguous; a live violation is the thing to
          # read first, and it is reported with the label below.
          if ($code -eq 0) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $guard -SelfTest
            $selfCode = if ($null -eq $LASTEXITCODE) { 255 } else { $LASTEXITCODE }
            if ($selfCode -ne 0) {
              Write-Host "::error title=Workflow guard self-test::The guard reported the live tree clean, but at least one of its nine rules did NOT fire on input planted to trip it, or its exit contract did not hold (self-test exit $selfCode). A clean run from a guard that cannot fire is the exact false assurance this file replaced. Read the per-case lines above."
              if ($env:GITHUB_STEP_SUMMARY) {
                Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "**Workflow guard:** SELF-TEST FAILED (exit $selfCode) - the live scan was clean but the guard was not shown able to fire."
              }
              exit $selfCode
            }
            Write-Host "workflow guard self-test: PASS - every rule fired on the shape planted for it, a clean fixture directory exited 0, and an empty or absent one exited 2. That is one shape per rule, not proof that any rule is right in general."
          }

          # Exit-code contract of tests\workflow_guard.ps1. There is
          # deliberately no "passed with a caveat": a workflow either reaches
          # one of these things or it does not, and a file that could not be
          # parsed is reported as a violation rather than as a clean file.
          #   0  every workflow file parsed and no rule fired
          #   1  at least one hit, or at least one file that would not parse
          #   2  the guard aborted; the workflows were NOT checked. An
          #      enumeration returning zero files is an abort, never a pass.
          $label = switch ($code) {
            0       { 'PASS - no workflow names a non-hosted runner, uses pull_request_target, or reaches a secret, every file under .github\ that GitHub reads at run time parses, and the guard was demonstrated able to fire on all nine rules. That is a statement about the FILES IN THIS REPOSITORY only: an action pulled from another repository runs code this guard never sees, and parsing dependabot.yml or an issue form is not validating it against GitHub''s schema.' }
            1       { 'FAIL (exit 1) - a workflow reaches a runner GitHub does not host, uses pull_request_target, uses a secret, or could not be parsed. Read the file:line list above. Do NOT add an allowlist entry to silence it unless the use is genuinely necessary and the reason is stated on the entry.' }
            2       { 'ABORT (exit 2) - the guard did not complete, so nothing about these workflows was established by this run.' }
            255     { 'NOT RUN (exit 255) - tests\workflow_guard.ps1 could not be invoked.' }
            default { "UNKNOWN (exit $code) - outside the documented 0/1/2 contract." }
          }

          if ($code -eq 0) {
            Write-Host "workflow guard: $label"
          } else {
            Write-Host "::error title=Workflow guard::$label"
          }
          if ($env:GITHUB_STEP_SUMMARY) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "**Workflow guard:** $label"
          }
          exit $code

      # THE permissions.deny PARITY STEP WAS REMOVED ON 30 JULY 2026, together
      # with tests\deny_parity.ps1 and its two fixtures, when the last gate went.
      # bin\lwg-setup.ps1 now writes NO deny rules at all - Get-DenyGroups is
      # empty - so there is no table to hold to a fixture. A step asserting that
      # an empty table is still empty would report "deny parity: PASS" on every
      # run, which reads as a verified protection and is the precise class of
      # false assurance this repo exists to refuse. That half is settled and is
      # not coming back.
      #
      # THE OTHER HALF HAS BEEN PUT BACK. That file was also the only check on
      # the installer's MERGE behaviour - unrelated top-level keys preserved,
      # exactly one backup holding the original bytes, a stale BaseHash refused,
      # idempotence, rollback - and from 30 July 2026 until the step below
      # landed, nothing tested it while /lw-watchtower:setup went on writing into real
      # settings.json files. "Installer merge suite" is that harness re-targeted
      # at the STATUSLINE section, which still writes. It is not a revival of
      # the deny fixtures and asserts nothing about a deny table.

      - name: Delegate gate regression suite
        shell: powershell
        run: |
          # One of the nine tests of behaviour in this repository, and the only
          # one that tests a GATE. The parse and scan steps ask whether files are
          # well formed; this asks whether the one gate this plugin ships refuses
          # what it says it refuses. The installer merge suite, the stop-hook
          # behaviour suite, the uninstaller footprint suite, the evidence-state
          # suite, the doctor behaviour suite, the toggle write-path suite, the
          # SubagentStart fast-scan suite and the payload disclosure guard below
          # are the other eight.
          #
          # This sentence said THREE and named the wrong two until 3 August 2026,
          # 279 lines below this file's own header saying FIVE. It survived
          # because tests\doc_claims.ps1 had no pattern for the `N of the M tests
          # of behaviour` shape - the quantity is the SECOND number there, and
          # every other shape in that guard captures the first one it sees. The
          # shape is read now, so this line cannot go stale again in silence -
          # and THIS LINE IS THE ONLY PLACE IN THE TREE THAT FEEDS IT, so
          # rewording it out of that shape takes the guard to exit 2 on a dead
          # pattern rather than quietly dropping a check.
          #
          # It runs each case through a real pipe into a real child process -
          # `type payload.json | powershell -File lib\gate_delegate.ps1` - because
          # a PowerShell object pipe never reaches [Console]::In, which is where
          # a hook reads its payload. Nothing real is touched: every case points
          # CLAUDE_PLUGIN_ROOT and CLAUDE_PLUGIN_DATA at a throwaway directory.
          #
          # Same capture pattern as the steps around it: a nonzero native exit
          # code does NOT fail a PowerShell step on its own, so it is re-raised
          # explicitly, and stderr is deliberately not merged with 2>&1 - in
          # Windows PowerShell 5.1 that wraps native stderr in NativeCommandError
          # records and corrupts the result.
          $ErrorActionPreference = 'Continue'
          $suite = 'tests\gate_delegate.ps1'

          if (-not (Test-Path -LiteralPath $suite -PathType Leaf)) {
            Write-Host "::error::$suite is missing - the gate was never exercised, which is not the same as passing"
            exit 1
          }

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $suite
          $code = if ($null -eq $LASTEXITCODE) { 255 } else { $LASTEXITCODE }

          # Exit-code contract of tests\gate_delegate.ps1. There is deliberately
          # no "passed with a caveat", and an abort is never reported as a pass.
          #   0  every case passed
          #   1  at least one case failed
          #   2  the suite aborted; the gate was NOT exercised. Zero cases run
          #      is an abort, never an empty-set pass.
          $label = switch ($code) {
            0       { 'PASS - every case behaved. That is "these cases still behave", NOT "the gate is sound": the last gate here was 67/67 green with five bypasses open. See docs\gates-removed.md, Lesson 3.' }
            1       { 'FAIL (exit 1) - the gate did not behave as declared. Read the per-case lines above; a DENY case that exited 0 or 1 is a gate that has silently failed open.' }
            2       { 'ABORT (exit 2) - the suite did not complete, so nothing about the gate was established by this run.' }
            255     { 'NOT RUN (exit 255) - tests\gate_delegate.ps1 could not be invoked.' }
            default { "UNKNOWN (exit $code) - outside the documented 0/1/2 contract." }
          }

          if ($code -eq 0) {
            Write-Host "delegate gate suite: $label"
          } else {
            Write-Host "::error title=Delegate gate suite::$label"
          }
          if ($env:GITHUB_STEP_SUMMARY) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "**Delegate gate suite:** $label"
          }
          exit $code

      - name: Installer merge suite
        shell: powershell
        run: |
          # The second step in this job that tests behaviour, and the only one
          # that tests a WRITE. bin\lwg-setup.ps1 merges into the operator's
          # real settings.json - the file holding every other setting they have
          # - and this exercises that merge on the statusline section: keys it
          # was not asked to touch keep their values AND their order, exactly
          # one backup is taken and it holds the original bytes, a stale
          # BaseHash is refused rather than merged over, a second run writes
          # nothing at all, and rollback restores byte for byte.
          #
          # THE STEP NAME IS NOW NARROWER THAN THE SUITE, and this comment said
          # only the above until 3 August 2026, when four sections that are not
          # about the installer at all landed in the same file: the status line
          # driven byte-exactly through a real child process, bin\lwg-sitrep.ps1
          # and lib\resolve.ps1 against a scratch state directory, and
          # bin\lwg-update.ps1 - which had no coverage of any kind before that
          # day - against a local bare repository. They are here because this
          # file already owned the only harness that runs any of them for real.
          # The NAME is deliberately not changed: it is matched by a required
          # status check on main, so renaming it stops satisfying the
          # requirement - the same reason recorded against the job name above.
          #
          # IT NOW NEEDS `git` ON PATH, WHICH NO OTHER STEP HERE DOES. The
          # update section ABORTS the whole suite with exit 2 if git is absent
          # rather than skipping, because a suite that quietly drops the only
          # coverage bin\lwg-update.ps1 has is the empty-set pass this repo has
          # been bitten by. GitHub's windows-latest image ships git, so this is
          # a statement about what the step depends on, not a risk it manages -
          # on a runner without git the abort below reports it as an abort.
          #
          # Nothing real is touched. Every case runs against a throwaway tree
          # under the temp directory, with -SettingsPath pointed into it and
          # $env:USERPROFILE swapped around each call and restored afterwards -
          # the two-knob sandbox contract documented in the installer's own
          # header - and the four sections above add CLAUDE_PLUGIN_DATA and a
          # bare repository built under the temp root, so no case reaches a
          # network and every "remote" is local. No case runs elevated or
          # constructs a destructive command.
          #
          # WHAT IT DOES NOT COVER is named in the suite header rather than
          # left to be inferred, and the list has grown with the file: the
          # backup-collision suffix (clock-dependent, so a case for it would be
          # flaky), the post-write auto-restore (unreachable without fault
          # injection, since the merged JSON is parse-checked before the
          # write), the ATOMICITY of the write, the permissions MERGE, and the
          # enabled/disabled distinction. Read the header rather than this list
          # if the two ever disagree - the header is beside the cases and this
          # is not. Neither is faked to make a number look better.
          #
          # Same capture pattern as the steps around it: a nonzero native exit
          # code does NOT fail a PowerShell step on its own, so it is re-raised
          # explicitly, and stderr is deliberately not merged with 2>&1 - in
          # Windows PowerShell 5.1 that wraps native stderr in NativeCommandError
          # records and corrupts the result.
          $ErrorActionPreference = 'Continue'
          $suite = 'tests\setup_merge.ps1'

          if (-not (Test-Path -LiteralPath $suite -PathType Leaf)) {
            Write-Host "::error::$suite is missing - the installer's merge was never exercised, which is not the same as passing"
            exit 1
          }

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $suite
          $code = if ($null -eq $LASTEXITCODE) { 255 } else { $LASTEXITCODE }

          # Exit-code contract of tests\setup_merge.ps1, the same three this
          # repo's other suites use. An abort is never reported as a pass.
          #   0  every case passed
          #   1  at least one case failed
          #   2  the suite aborted; the merge was NOT exercised. Zero cases run
          #      is an abort, never an empty-set pass.
          $label = switch ($code) {
            0       { 'PASS - the statusline merge still preserves unrelated keys and their order, backs up once, refuses a stale BaseHash, is idempotent and rolls back byte for byte. That is a statement about the STATUSLINE section only: the hooks and permissions sections go through the same writer and are not exercised here.' }
            1       { 'FAIL (exit 1) - the installer''s merge did not behave as declared. Read the per-case lines above. A failure here means /lw-watchtower:setup can damage a real settings.json, so treat it as blocking rather than as a flaky test.' }
            2       { 'ABORT (exit 2) - the suite did not complete, so nothing about the merge was established by this run.' }
            255     { 'NOT RUN (exit 255) - tests\setup_merge.ps1 could not be invoked.' }
            default { "UNKNOWN (exit $code) - outside the documented 0/1/2 contract." }
          }

          if ($code -eq 0) {
            Write-Host "installer merge suite: $label"
          } else {
            Write-Host "::error title=Installer merge suite::$label"
          }
          if ($env:GITHUB_STEP_SUMMARY) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "**Installer merge suite:** $label"
          }
          exit $code

