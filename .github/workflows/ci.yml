          # `command` evaluator in bin\lwg-evidence.ps1 could not tell them
          # apart: on the MARKETPLACE install route the plugin directory has no
          # .git, so every git-backed rule exited 128 having read nothing and
          # was scored as a finding. Two rows then told a consumer that the
          # owner's personal address WAS left in history and that the private
          # sibling project's name IS in the tree - the opposite of the truth,
          # about facts nothing had measured. It was found by adversarial UAT
          # on the install route the maintainer does not use.
          #
          # Half the suite is the mirror: probes that genuinely ran and
          # genuinely failed must STAY findings. Answering "unverified" to
          # everything would be a worse defect than the one it replaced.
          #
          # Same capture pattern as the steps around it: a nonzero native exit
          # code does NOT fail a PowerShell step on its own, so it is re-raised
          # explicitly, and stderr is deliberately not merged with 2>&1 - in
          # Windows PowerShell 5.1 that wraps native stderr in NativeCommandError
          # records and corrupts the result.
