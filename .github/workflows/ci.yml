          #   2  the suite aborted; the engine was NOT exercised. Zero cases
          #      run is an abort, never an empty-set pass.
          $label = switch ($code) {
            0       { 'PASS - a probe that could not run still renders UNVERIFIED and a probe that ran and failed still renders NOT STARTED. That is a statement about the five could-not-run signals the suite lists, NOT that the engine can always tell the two apart.' }
            1       { 'FAIL (exit 1) - the evidence engine mis-states what it observed. Read the per-case lines above. A case expecting UNVERIFIED that reported a finding means the checklist asserts something about a fact it never measured, which is the defect this whole plugin exists to catch.' }
            2       { 'ABORT (exit 2) - the suite did not complete, so nothing about the evidence engine was established by this run.' }
